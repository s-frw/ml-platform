apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 18.3.0
    helm:
      values: |
        auth:
          enablePostgresUser: true
          username: psql_user
          password: psql_password
          database: psql_db
          postgresPassword: postgres_admin_password
  destination:
    server: https://kubernetes.default.svc
    namespace: psql-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  syncOptions:
    - CreateNamespace=true

