apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-observability-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"

data:
  gpu-observability.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },

      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,

      "panels": [

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "GPU Utilization",
          "type": "gauge",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_GPU_UTIL{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "GPU {{gpu}}",
              "refId": "A"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 8192,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 6000 },
                  { "color": "red", "value": 7500 }
                ]
              },
              "unit": "decmbytes"
            }
          },
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 0 },
          "id": 2,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "Memory Used",
          "type": "gauge",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_FB_USED{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "GPU {{gpu}}",
              "refId": "A"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "celsius"
            }
          },
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 0 },
          "id": 3,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "GPU Temperature",
          "type": "gauge",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_GPU_TEMP{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "GPU {{gpu}}",
              "refId": "A"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 130,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 110 }
                ]
              },
              "unit": "watt"
            }
          },
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 0 },
          "id": 4,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "Power Usage",
          "type": "gauge",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_POWER_USAGE{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "GPU {{gpu}}",
              "refId": "A"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "title": "GPU & Memory Utilization",
          "type": "timeseries",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_GPU_UTIL{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "GPU Util",
              "refId": "A"
            },
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_MEM_COPY_UTIL{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Mem Copy Util",
              "refId": "B"
            },
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_ENC_UTIL{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Encoder Util",
              "refId": "C"
            },
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_DEC_UTIL{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Decoder Util",
              "refId": "D"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "decmbytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 6,
          "title": "Framebuffer Memory",
          "type": "timeseries",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_FB_USED{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Used",
              "refId": "A"
            },
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_FB_FREE{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Free",
              "refId": "B"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "celsius"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "id": 7,
          "title": "Temperatures",
          "type": "timeseries",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_GPU_TEMP{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "GPU Temp",
              "refId": "A"
            },
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_MEMORY_TEMP{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Memory Temp",
              "refId": "B"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "MHz"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 8,
          "title": "Clocks",
          "type": "timeseries",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_SM_CLOCK{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "SM Clock",
              "refId": "A"
            },
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_MEM_CLOCK{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Memory Clock",
              "refId": "B"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "watt"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "id": 9,
          "title": "Power Usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_POWER_USAGE{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "Power (W)",
              "refId": "A"
            }
          ]
        },

        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "id": 10,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            }
          },
          "title": "XID Errors",
          "type": "stat",
          "targets": [
            {
              "expr": "max by (UUID, gpu) (DCGM_FI_DEV_XID_ERRORS{job=\"nvidia-dcgm-exporter\",instance=~\"$instance\"})",
              "legendFormat": "XID Errors",
              "refId": "A"
            }
          ]
        }

      ],

      "schemaVersion": 30,
      "style": "dark",
      "tags": ["gpu", "nvidia", "dcgm"],

      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {},
            "datasource": "Prometheus",
            "definition": "label_values(DCGM_FI_DEV_GPU_UTIL, instance)",
            "hide": 0,
            "includeAll": true,
            "multi": false,
            "name": "instance",
            "options": [],
            "query": "label_values(DCGM_FI_DEV_GPU_UTIL, instance)",
            "refresh": 2,
            "sort": 1,
            "type": "query",
            "label": "Instance"
          }
        ]
      },

      "time": {
        "from": "now-30m",
        "to": "now"
      },

      "timepicker": {},
      "timezone": "browser",
      "title": "NVIDIA RTX 3050 — GPU Observability",
      "uid": "gpu-observability-3050",
      "version": 2
    }
