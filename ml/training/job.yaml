apiVersion: batch/v1
kind: Job
metadata:
  name: iris-training
  namespace: ml-platform
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: sfr1/iris-training:0.1.1
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-platform.svc.cluster.local:5000"
