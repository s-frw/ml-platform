apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/s-frw/ml-platform.git
    targetRevision: HEAD
    path: platform/data/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: pgsql-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

