apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-init
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/s-frw/ml-platform.git
    targetRevision: HEAD
    path: platform/data/postgres-init
  destination:
    server: https://kubernetes.default.svc
    namespace: psql-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

